<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CladFlo — tests</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; max-width: 760px; }
    h1 { font-size: 18px; }
    #summary { font-weight: 700; padding: 8px 12px; border-radius: 8px; display: inline-block; }
    #summary.pass, li.pass { color: #1b7a43; }
    #summary.fail, li.fail { color: #c0334a; }
    ul { list-style: none; padding: 0; }
    li { padding: 3px 0; border-bottom: 1px solid #eee; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>CladFlo — test suite</h1>
  <p id="summary">running…</p>
  <ul id="results"></ul>

  <script type="module">
    import './calendar.test.js';
    import './storage.test.js';
    import './reminders.test.js';
    import './theme.test.js';
    import './phone-location.test.js';
    import './dashboard.test.js';
    import './ui-pure.test.js';
    import { importerTestsDone } from './importer.test.js';
    import { fileStoreTestsDone } from './file-store.test.js';
    import { cloudTestsDone } from './cloud.test.js';
    import { saveStatusTestsDone } from './save-status.test.js';
    import './transcript.test.js';
    import { recordsTestsDone } from './records.test.js';
    import './history.test.js';
    import { groqTestsDone } from './groq.test.js';
    import { minutesTestsDone } from './minutes.test.js';
    import { storeTestsDone } from './store.test.js';
    import './registry.test.js';
    import './deals.test.js';
    import './timeline.test.js';
    import './timetrack.test.js';
    import './pickers.test.js';
    import './drag.test.js';
    import { chatTestsDone } from './chat.test.js';
    import { aiTestsDone } from './ai.test.js';
    import { report } from './runner.js';
    await Promise.all([chatTestsDone, importerTestsDone, fileStoreTestsDone, cloudTestsDone, saveStatusTestsDone, recordsTestsDone, groqTestsDone, minutesTestsDone, storeTestsDone, aiTestsDone]);
    report();
  </script>
</body>
</html>
